<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h1>Sistema Hipotético para Atividade Prática</h1>
  <hr>
  <form id="login-form">
    <p>
      <label for="usuario">USUÁRIO:</label>
      <input type="text" id="usuario" name="usuario">
    </p>
    <p>
      <label for="senha">SENHA:</label>
      <input type="password" id="senha" name="senha">
    </p>
    <button type="submit" id="entrar">ENTRAR</button>
  </form>
  <script>
    // Somente o campo usuario e validado (a senha nao e verificada).
    // A comparacao com "admin" e exata e sensivel a maiusculas/minusculas:
    // "Admin" ou "ADMIN" sao tratados como operador.
    function destinoLogin(usuario) {
      var u = (usuario || "").trim();
      if (u === "") {
        return "msg.html";
      }
      if (u === "admin") {
        return "pg001.html";
      }
      return "pg002.html";
    }

    // Usa o evento submit do formulario para que ENTER tambem faca o login.
    document.getElementById("login-form").addEventListener("submit", function (evento) {
      evento.preventDefault();
      location.href = destinoLogin(document.getElementById("usuario").value);
    });
  </script>
</body>
</html>
