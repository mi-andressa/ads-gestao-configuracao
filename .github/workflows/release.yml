# Release HIPOTETICO da atividade de Gestao de Configuracao.
# Ao publicar uma tag no formato v* (ex.: v1.0.0), este workflow gera
# o pacote .zip das paginas .html da raiz e cria um GitHub Release.
# Nao ha deploy real: serve apenas para demonstrar o fluxo de release.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (historico completo para o git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair notas da versao
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          : > release-notes.md
          # 1) Tenta usar a secao da versao no CHANGELOG.md (## [x.y.z] ou ## x.y.z)
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                if (index($0, "[" v "]") || index($0, " " v " ") || $0 ~ (" " v "$")) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          # 2) Sem secao no CHANGELOG: usa git log desde a tag anterior
          if [ ! -s release-notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..${TAG}"
            else
              RANGE="${TAG}"
            fi
            echo "## Alteracoes" > release-notes.md
            git log --pretty='- %s (%h)' "$RANGE" >> release-notes.md
          fi
          cat release-notes.md

      - name: Empacotar paginas HTML da raiz
        run: zip "release-${{ github.ref_name }}.zip" ./*.html

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-${{ github.ref_name }}.zip
